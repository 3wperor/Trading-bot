# Trading parameters. Secrets (API tokens) go in .env, not here.

trading:
  pairs: [EUR_USD, GBP_USD, USD_JPY, AUD_USD]
  granularity: M15        # candle size: M5, M15, M30, H1, H4 ...
  poll_interval: 30       # seconds between checks for new candles
  candle_count: 250       # history fetched per evaluation
  combine_mode: any       # "any": one strategy fires & none opposes
                          # "agree": all strategies must agree (fewer trades)
  exit_on_opposite: true  # close a position if a confirmed opposite signal appears

risk:
  risk_per_trade_pct: 0.5   # % of equity risked if the stop-loss is hit
  sl_atr_mult: 2.0          # stop-loss distance = 2 x ATR(14)
  tp_atr_mult: 3.0          # take-profit distance = 3 x ATR(14)
  max_open_trades: 3        # across all pairs
  max_daily_loss_pct: 3.0   # halt new trades for the day past this drawdown
  max_spread_pips: 3.0      # skip entries when the spread is wider than this
  max_units: 1000000        # absolute position size cap

strategies:
  - name: trend_following
    enabled: true
    params:
      ema_fast: 20
      ema_slow: 50
      rsi_period: 14
      adx_period: 14
      adx_min: 20
  - name: mean_reversion
    enabled: true
    params:
      bb_period: 20
      bb_std: 2.0
      rsi_period: 14
      rsi_oversold: 30
      rsi_overbought: 70
      adx_period: 14
      adx_max: 25

db_path: trades.db
log_level: INFO
